site_name: Evis Plaku
site_url: https://evisp.github.io/
site_description: Lecturer, AI researcher and mentor in Tirana. Teaching algorithms, researching autonomous navigation, and helping people grow.
site_author: Evis Plaku
copyright: © 2026 Evis Plaku

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false                     # fonts are self-hosted in notebook.css
  favicon: assets/images/favicon.svg
  icon:
    logo: lucide/chess-knight
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.footnote.tooltips
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: lucide/moon
        name: Switch to night notebook
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: lucide/sun
        name: Switch to day notebook

plugins:
  - search
  - blog:
      blog_dir: writing
      post_url_format: "{slug}"
      post_readtime: true
      post_excerpt: required
      archive_name: Archive
      categories_name: Series
      categories_allowed:
        - Ancient Algorithms
        - Essays
        - Notes
      pagination_per_page: 10
  - rss:
      match_path: "writing/posts/.*"
      date_from_meta:
        as_creation: date.created
      categories:
        - categories
  - macros:
      render_by_default: false    # only pages with render_macros: true use {{ }}
      include_yaml:
        - data/publications.yml
        - data/topics.yml

extra:
  generator: false
  social:
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0002-4042-2673
      name: ORCID
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.com/citations?user=NRYpvpcAAAAJ
      name: Google Scholar
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/evisplaku/
      name: LinkedIn
    - icon: lucide/rss
      link: /feed_rss_created.xml
      name: Writing (RSS feed)

extra_css:
  - stylesheets/notebook.css

# Markdown extensions: none listed on purpose. Zensical then enables its full
# default set (admonitions, attr_list, md_in_html, footnotes, ==highlight==,
# icons like :lucide-chess-pawn:, tabs, code highlighting, and more).

nav:
  - Home: index.md
  - Research:
      - research/index.md
      - Publications: research/publications.md
      - Talks & Media: research/talks.md
      - Code & Data: research/code.md
  - Teaching:
      - teaching/index.md
      - Data Structures & Algorithms: teaching/dsa.md
      - OOP in Java: teaching/oop-java.md
      - Machine Learning: teaching/machine-learning.md
      - For Students: teaching/for-students.md
  - Mentoring:
      - mentoring/index.md
      - Thesis Topics: mentoring/thesis-topics.md
      - Students & Alumni: mentoring/students.md
  - Initiatives: initiatives/index.md
  - Writing:
      - writing/index.md
  - About:
      - about/index.md
      - CV: about/cv.md
      - Beyond Work: about/beyond-work.md
      - Contact: about/contact.md
