# Thesis topics. Copy an entry to add one; set status to "taken" to show it as filled.
# area: agents | rag | robotics
# level: BSc | MSc | BSc or MSc

areas:
  agents: AI agents
  rag: Agentic RAG
  robotics: Robotics

topics:

  - title: An AI agent that plans with a motion planner
    area: agents
    level: BSc or MSc
    summary: An LLM agent turns a task in plain language into goals and constraints, calls a sampling-based motion planner as a tool, and checks the path it gets back.
    skills: [Python, LLM tool calling, Motion planning]
    status: open

  - title: An agentic RAG assistant that cites its sources
    area: rag
    level: BSc or MSc
    summary: An assistant for course material that decides when to search again, answers with citations students can check, and is measured on how often it is right.
    skills: [Python, Embeddings, Evaluation]
    status: open

  - title: Safety zones around moving people, in simulation
    area: robotics
    level: MSc
    summary: Extend safety-zone path planning so the margins adapt to how people move, and compare it with a fixed-margin planner in ROS 2.
    skills: [ROS 2, Gazebo, Risk-aware planning]
    status: open
